<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>TuPoker · Póker con tus amigos</title>
    <meta name="description" content="TuPoker: lleva tus partidas de póker con amigos. Fichas, turnos, probabilidades en vivo, grupos y rankings. Con cartas físicas o repartidas por la app." />
    <meta name="theme-color" content="#0b1026" />
    <meta name="application-name" content="TuPoker" />

    <!-- iconos -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- app instalable en el móvil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TuPoker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- al compartir el enlace (WhatsApp, redes) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TuPoker" />
    <meta property="og:title" content="TuPoker · Póker con tus amigos" />
    <meta property="og:description" content="Fichas, turnos, probabilidades en vivo, grupos y rankings para tus partidas." />
    <meta property="og:image" content="https://tupoker.online/og-image.png" />
    <meta property="og:url" content="https://tupoker.online" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
