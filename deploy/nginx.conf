# /etc/nginx/sites-available/tupoker
# HTTPS: sudo certbot --nginx -d tupoker.online -d www.tupoker.online
# (certbot añade solo los bloques de SSL y la redirección a https)

server {
    listen 80;
    listen [::]:80;
    server_name tupoker.online www.tupoker.online;

    root /var/www/tupoker/frontend/dist;
    index index.html;

    client_max_body_size 4m;   # fotos de perfil

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real (WebSocket)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Enlaces de invitación: el servidor pone el nombre de la mesa / grupo en la vista previa
    # (WhatsApp, Telegram...). Después cargan la misma app de siempre.
    location ~ ^/(unirse|grupos/unirse)/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # si la API no responde, se sirve la app normal
        proxy_intercept_errors on;
        error_page 404 502 503 504 = /index.html;
    }

    # Manifest de la app instalable con su tipo correcto
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Fotos de perfil subidas
    location /uploads/ {
        alias /var/www/tupoker/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Assets con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
