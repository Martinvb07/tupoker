# /etc/nginx/sites-available/tupoker
# HTTPS: sudo certbot --nginx -d tupoker.online -d www.tupoker.online
# (certbot añade solo los bloques de SSL y la redirección a https)

server {
    listen 80;
    listen [::]:80;
    server_name tupoker.online www.tupoker.online;

    root /var/www/tupoker/frontend/dist;
    index index.html;

    client_max_body_size 4m;   # fotos de perfil

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real (WebSocket)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Fotos de perfil subidas
    location /uploads/ {
        alias /var/www/tupoker/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Assets con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
